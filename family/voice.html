<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b2147">
<title>Family board voice test</title>
<style>
html,body{margin:0;height:100%;background:#2b2147;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{box-sizing:border-box;max-width:900px;margin:0 auto;padding:18px 20px 28px;text-align:center}
h1{margin:0 0 4px;font-size:26px}
.sub{margin:0 0 14px;color:#cfc6ea;font-size:15px}
#status{min-height:24px;margin:0 0 10px;font-size:18px;color:#ffe9a8}
#heard{margin:6px auto 4px;min-height:96px;font-size:84px;font-weight:800;letter-spacing:2px;text-transform:uppercase;line-height:96px}
#heard.flash{color:#7ff0a8}
#what{min-height:26px;font-size:20px;color:#e6defa}
button{min-width:180px;min-height:56px;margin:16px 6px 10px;padding:0 26px;border:0;border-radius:999px;background:#ffb347;color:#2b2147;font-size:20px;font-weight:700;cursor:pointer}
button[disabled]{opacity:.45;cursor:default}
#words{margin:12px auto 0;max-width:720px;font-size:16px;line-height:1.7;color:#e6defa}
#words b{display:inline-block;margin:2px 4px;padding:0 10px;border-radius:8px;background:#3b2f63;color:#fff;font-weight:600}
#log{margin:14px auto 0;max-width:560px;font-size:14px;color:#bdb3dd;min-height:20px}
#info{margin-top:10px;font-size:13px;color:#a99fcc}
a{color:#ffd27a}
</style>
</head>
<body>
<main>
  <h1>Voice test</h1>
  <p class="sub">Everything stays on this tablet. Nothing you say is sent anywhere.</p>
  <p id="status">Getting ready...</p>
  <div id="heard">&nbsp;</div>
  <div id="what">&nbsp;</div>
  <button type="button" id="go" disabled>Start</button>
  <div id="words">
    Say one word at a time, clearly, from where you'd stand in the kitchen:<br>
    <b>go</b><b>stop</b><b>left</b><b>right</b><b>up</b><b>down</b><b>yes</b><b>no</b><b>one</b><b>two</b><b>three</b>
  </div>
  <div id="log"></div>
  <div id="info"></div>
  <p><a href="./">Back to the family board</a></p>
</main>
<script src="voice/tf.min.js"></script>
<script src="voice/speech-commands.min.js"></script>
<script>
(function () {
  var rec = null, on = false, heardCount = 0, last = [], flashT = null;
  var MEANS = {
    go: 'On the board: wake the screen',
    stop: 'On the board: put the screen to sleep',
    left: 'On the board: go to the screen on the left',
    right: 'On the board: go to the screen on the right',
    up: 'On the board: show photos full screen',
    down: 'On the board: go back to Home',
    yes: 'Heard yes', no: 'Heard no',
    one: 'On the board: Home', two: 'On the board: Calendar', three: 'On the board: Notes'
  };
  function $(id) { return document.getElementById(id); }
  function status(t) { $('status').textContent = t; }
  window.onerror = function (m) { status('Something went wrong: ' + m); };

  function load() {
    var t0 = new Date().getTime();
    if (!window.tf || !window.speechCommands) { status("This tablet's browser couldn't load the voice helper."); return; }
    status('Loading the voice helper. The first time takes a while (about 7 MB).');
    tf.ready().then(function () {
      var base = location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, '') + 'voice/';
      rec = speechCommands.create('BROWSER_FFT', undefined, base + 'model.json', base + 'metadata.json');
      return rec.ensureModelLoaded();
    }).then(function () {
      var secs = Math.round((new Date().getTime() - t0) / 100) / 10;
      status('Ready. Tap Start, then say one of the words below.');
      $('info').textContent = 'Loaded in ' + secs + ' seconds, using ' + tf.getBackend() + '.';
      $('go').disabled = false;
    }, function (e) {
      status("The voice helper couldn't load on this tablet: " + (e && e.message ? e.message : e));
    });
  }

  function show(word, score) {
    var pct = Math.round(score * 100);
    heardCount++;
    $('heard').textContent = word;
    $('what').textContent = (MEANS[word] || ('Heard ' + word)) + ' (' + pct + '% sure)';
    $('heard').className = 'flash';
    clearTimeout(flashT);
    flashT = setTimeout(function () { $('heard').className = ''; }, 900);
    last.unshift(word + ' ' + pct + '%');
    if (last.length > 6) last.pop();
    $('log').textContent = 'Heard so far: ' + last.join(', ');
  }

  function start() {
    var labels = rec.wordLabels();
    $('go').disabled = true;
    status('Asking for the microphone...');
    rec.listen(function (result) {
      var s = result.scores, best = 0, i, w;
      for (i = 1; i < s.length; i++) if (s[i] > s[best]) best = i;
      w = labels[best];
      if (w === '_background_noise_' || w === '_unknown_') return;
      show(w, s[best]);
    }, { probabilityThreshold: 0.8, overlapFactor: 0.5, invokeCallbackOnNoiseAndUnknown: false }).then(function () {
      on = true;
      $('go').textContent = 'Stop';
      $('go').disabled = false;
      status('Listening. Say a word.');
    }, function (e) {
      $('go').disabled = false;
      status("Couldn't use the microphone: " + (e && e.message ? e.message : e));
    });
  }

  function stopIt() {
    $('go').disabled = true;
    rec.stopListening().then(function () {
      on = false;
      $('go').textContent = 'Start';
      $('go').disabled = false;
      status(heardCount ? 'Stopped. It heard ' + heardCount + ' word' + (heardCount === 1 ? '' : 's') + '.' : 'Stopped. It didn\'t hear any words.');
    }, function () { $('go').disabled = false; });
  }

  $('go').onclick = function () { if (!rec) return; if (on) stopIt(); else start(); };
  load();
})();
</script>
</body>
</html>
