<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before You Click | An Adaptive Phishing-Judgment Simulation</title>
<meta name="description" content="An adaptive phishing-judgment simulation: a diagnostic inbox routes each learner down a personal mastery path, ending with a path map and a confidence calibration report.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090C; --bg2:#0A0D12; --panel:#10141B; --panel2:#151B24; --edge:#1B222B; --edge2:#28313D;
  --ink:#EDF1F4; --soft:#B4BDC6; --mut:#8A94A0; --faint:#626C77;
  --sig:#FF5A45; --sigD:#3A1611; --ok:#3ECF8E; --okD:#0D2B1F; --mint:#7DFFC4;
  /* --faint raised from #4A545F to meet WCAG AA contrast on the near-black background */
  --mailbg:#FAFBFC; --mailink:#12181F; --mailmut:#5D6B78; --mailedge:#E3E8ED;
  --disp:"Archivo","IBM Plex Sans",sans-serif;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1000px 500px at 75% -12%, rgba(255,90,69,.05), transparent 60%);
}
button{font-family:inherit;cursor:pointer}
.skip{position:absolute;left:-999px;top:10px;z-index:99;background:var(--sig);color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:700}
.skip:focus{left:10px}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px;border-radius:4px}

/* ============ top bar ============ */
.top{position:sticky;top:0;z-index:40;background:rgba(7,9,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--edge)}
.toprow{max-width:880px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--disp);font-weight:800;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--sig)}
.topright{display:flex;align-items:center;gap:10px}
.record{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--mut);white-space:nowrap}
.record b{color:var(--ink)}
.sndbtn{background:var(--panel);border:1px solid var(--edge2);color:var(--soft);border-radius:8px;padding:6px 11px;font-size:13px;line-height:1}
.sndbtn:hover{color:var(--ink);border-color:var(--mut)}
.phases{max-width:880px;margin:0 auto;padding:6px 18px 12px;display:flex;gap:0}
.phase{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.phase .bar{height:2px;background:var(--edge);overflow:visible;position:relative;margin-top:4px}
.phase .bar i{display:block;height:100%;width:0;background:var(--sig);transition:width .5s ease}
.phase .bar::after{content:"";position:absolute;left:0;top:50%;transform:translate(-30%,-50%);width:9px;height:9px;border-radius:50%;background:#39434F;z-index:1;transition:background .3s ease,box-shadow .3s ease}
.phase.now .bar::after{background:var(--sig);box-shadow:0 0 0 3px rgba(255,90,69,.16)}
.phase.done .bar::after{background:var(--ok)}
.phase.done .bar i{width:100%;background:var(--ok)}
.phase .lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1px}
.phase.now .lab{color:var(--sig)}
.phase.done .lab{color:var(--ok)}

/* ============ stage ============ */
.stage{max-width:880px;margin:0 auto;padding:26px 18px 64px}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .5s ease}
.screen:focus{outline:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.case{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.case::before{content:"";width:24px;height:1px;background:var(--sig);flex:none}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(34px,6.6vw,58px);line-height:.98;letter-spacing:-1.4px;text-transform:uppercase;margin-bottom:16px}
h1 .dim{color:var(--faint)}
h1 .red{color:var(--sig)}

/* ============ cover hero ============ */
.coverhero{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:30px;align-items:center;margin-bottom:24px}
.coverart{max-width:430px;justify-self:center}
.coverart svg{display:block;width:100%;height:auto}
.covimg{display:block;width:100%;height:auto}
@media (max-width:720px){
  .coverhero{grid-template-columns:1fr;gap:10px}
  .coverart{max-width:230px;order:-1;justify-self:start;margin-left:-10px}
}
.coverchips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
@media (max-width:720px){ .coverchips{grid-template-columns:repeat(2,1fr)} }
.cchip{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:13px 14px}
.cchip svg{flex:none;margin-top:2px}
.cchip .ct{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink);letter-spacing:.2px}
.cchip .cd{font-size:11.5px;color:var(--mut);line-height:1.45;margin-top:1px}
.h2{font-family:var(--disp);font-weight:800;font-size:clamp(22px,4.2vw,32px);line-height:1.04;letter-spacing:-.6px;margin-bottom:12px}
.h2 .dim{color:var(--faint)}
.lede{font-size:17px;line-height:1.6;color:var(--soft);margin-bottom:18px;max-width:60ch}
.body{font-size:15px;line-height:1.65;color:var(--soft);margin-bottom:12px;max-width:66ch}
.mut{color:var(--mut)} .mono{font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg2);border:none;border-radius:6px;
  padding:14px 26px;font-family:var(--disp);font-size:13px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(237,241,244,.12)}
.btn.sig{background:var(--sig);color:#fff}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--edge2)}
.btn.ghost:hover{box-shadow:none;border-color:var(--mut);color:var(--ink)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.dark-card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:20px;margin-bottom:14px}

/* ============ cold open ============ */
.stampline{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.glitch{animation:glitch .35s steps(2) 2}
@keyframes glitch{0%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(3px)}100%{transform:translateX(0)}}
.breach{display:flex;flex-direction:column;gap:10px;margin:20px 0}
.bcard{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--sig);
  border-radius:10px;padding:14px 16px;opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
.bcard.in{opacity:1;transform:none}
@keyframes bin{to{opacity:1;transform:none}}
.bcard .bt{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--sig);white-space:nowrap;padding-top:3px;min-width:104px}
.bcard .bd2{font-size:13.5px;color:var(--soft);line-height:1.55}
.bcard .bd2 b{color:var(--ink)}
.turn{border:1px solid var(--edge2);border-radius:12px;padding:20px;background:linear-gradient(135deg,rgba(62,207,142,.06),transparent 55%);margin-top:18px;opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
.turn.in{opacity:1;transform:none}
.turn .tt{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:-.2px;margin-bottom:8px}
.turn p{font-size:14px;color:var(--soft);line-height:1.6;max-width:60ch}
.turn .habit{color:var(--mint);font-weight:700}

/* ============ email client ============ */
.exhibit{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase;margin-bottom:9px}
.mail{background:var(--mailbg);color:var(--mailink);border-radius:8px;overflow:hidden;position:relative;
  box-shadow:0 0 0 1px var(--edge2),0 26px 70px rgba(0,0,0,.65);margin-bottom:14px}
.mail-chrome{display:flex;align-items:center;gap:8px;background:#EDF0F3;border-bottom:1px solid #DDE2E8;padding:9px 14px}
.dot{width:9px;height:9px;border-radius:50%;background:#C6CDD4}
.mail-app{margin-left:6px;font-size:11.5px;font-weight:600;color:var(--mailmut)}
.mail-head{padding:15px 18px 11px;border-bottom:1px solid #EFF2F5}
.mail-subj{font-size:16px;font-weight:700;letter-spacing:-.2px;margin-bottom:9px}
.fromrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:#12181F;color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px}
.fromname{font-weight:600;font-size:13px}
.fromtime{font-size:11px;color:var(--mailmut);margin-left:auto}
.inspect-btn{border:1px dashed #AEBBC6;background:#fff;color:#3E5266;font-size:10.5px;font-weight:600;
  padding:4px 10px;border-radius:999px;transition:all .2s ease}
.inspect-btn:hover{border-color:#7C90A3;background:#F1F5F8}
.realaddr{font-family:var(--mono);font-size:11.5px;background:#FDECEA;border:1px solid #F5C4BD;color:#B0261A;
  padding:3px 9px;border-radius:5px;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.mail-body{padding:16px 18px 6px;font-size:15px;line-height:1.6;color:#33404D}
.mail-body p{margin-bottom:11px;max-width:60ch}
.mail-body .sig2{color:var(--mailmut);font-size:12.5px}
.maillink{background:none;border:none;padding:0;color:#0B5CD6;text-decoration:underline;font:inherit;cursor:pointer}
.bigbtn-link{display:inline-block;background:#0B5CD6;color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:13px;font-weight:600;margin:2px 0 6px;cursor:pointer}
.attach{display:inline-flex;align-items:center;gap:8px;background:#EFF3F6;border:1px solid var(--mailedge);
  border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;color:#33475C;margin:2px 0 8px}
.attach .ext{font-family:var(--mono);font-size:9.5px;background:#DDE5EB;padding:2px 6px;border-radius:4px}
.statusbar{display:flex;gap:10px;align-items:center;background:var(--bg2);color:var(--mint);font-family:var(--mono);
  font-size:11.5px;padding:10px 14px;min-height:38px;border-top:1px solid var(--edge);word-break:break-all;transition:background .2s ease}
.statusbar .lab{color:var(--faint);letter-spacing:1.5px;font-size:9px;flex:none}
.statusbar.alerted{background:var(--sigD);color:#FFB3A8}
.mail-note{padding:0 18px 13px;font-size:10.5px;color:#93A3B0}

/* coach banner + pulse */
.coach-banner{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--sig);border-radius:9px;
  padding:11px 14px;margin-bottom:12px;font-size:12.5px;color:var(--soft);line-height:1.5;animation:pop .35s ease}
.coach-banner .k{font-family:var(--mono);color:var(--sig);font-size:9px;letter-spacing:1.5px;flex:none;padding-top:3px}
.coach-banner b{color:var(--ink)}
.pulse{animation:pulseGlow 1.5s ease-in-out infinite;border-radius:6px}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,90,69,0)}50%{box-shadow:0 0 0 4px rgba(255,90,69,.4)}}
/* mini hover demo inside the coach banner */
.demo{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.dwrap{position:relative;display:inline-block}
.dlink{display:inline-block;background:#0B5CD6;color:#fff;border-radius:5px;padding:6px 12px;font-weight:600;font-size:11px}
.dcur{position:absolute;right:6px;bottom:-4px;animation:demoHover 2.8s ease-in-out infinite}
.dstat{font-family:var(--mono);font-size:11.5px;color:var(--mint);opacity:0;animation:demoStat 2.8s ease-in-out infinite}
@keyframes demoHover{0%,12%{transform:translate(30px,16px)}42%,86%{transform:translate(0,0)}100%{transform:translate(30px,16px)}}
@keyframes demoStat{0%,38%{opacity:0}52%,86%{opacity:1}100%{opacity:0}}

/* ============ director (worked-example demo engine) ============ */
.demomail .mail{pointer-events:none}
.dirlayer{position:absolute;inset:0;pointer-events:none;z-index:6}
.dircurwrap{position:absolute;left:0;top:0;z-index:9;transition:transform .52s cubic-bezier(.45,.05,.35,1);will-change:transform}
.dircurwrap svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));display:block}
.dirring{position:absolute;left:-9px;top:-9px;width:34px;height:34px;border:2.5px solid var(--mint);border-radius:50%;
  animation:dirringA 1s ease-in-out infinite;pointer-events:none}
@keyframes dirringA{0%,100%{transform:scale(.7);opacity:.4}50%{transform:scale(1);opacity:1}}
.dirripple{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border:2.5px solid var(--sig);border-radius:50%;
  animation:dirripA .55s ease-out forwards;pointer-events:none}
@keyframes dirripA{from{transform:scale(.4);opacity:.95}to{transform:scale(2.8);opacity:0}}
.dirmask{position:absolute;border-radius:8px;box-shadow:0 0 0 9999px rgba(7,9,12,.72);pointer-events:none;z-index:7;transition:all .35s ease}
.dirthought{position:absolute;max-width:min(320px,80%);background:var(--panel);border:1.5px dashed var(--sig);border-radius:10px;
  padding:9px 13px;font-size:14px;color:var(--ink);line-height:1.5;z-index:8;box-shadow:0 12px 34px rgba(0,0,0,.55);animation:pop .25s ease}
.dirthought .tk{font-family:var(--mono);font-size:8.5px;letter-spacing:1.6px;color:var(--sig);display:block;margin-bottom:3px;text-transform:uppercase}
.dirthoughtlist{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.dirthoughtlist .dt{display:flex;gap:9px;font-size:14px;color:var(--soft);line-height:1.5}
.dirthoughtlist .dt::before{content:"“";color:var(--sig);font-family:var(--disp);font-weight:800;flex:none}
.dirthoughtlist .dt.say{color:var(--ink);font-weight:600}
.dirthoughtlist .dt.say::before{content:"▸";font-family:var(--mono);font-weight:400}
.dirbadge{position:absolute;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1px;padding:4px 10px;border:1.5px solid;
  border-radius:5px;transform:rotate(-2deg);z-index:8;background:var(--bg2);animation:pop .25s ease;text-transform:uppercase;white-space:nowrap}
.dirbadge.bad{color:#FFA79C;border-color:var(--sig)}
.dirbadge.good{color:#7FE8BC;border-color:#2A7A57}
.dirbar{display:flex;gap:8px;align-items:center;margin:10px 0 4px;flex-wrap:wrap}
.dirbtn{background:var(--panel);border:1px solid var(--edge2);color:var(--soft);border-radius:7px;padding:8px 15px;
  font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.dirbtn:hover{color:var(--ink);border-color:var(--mut)}
.dirbtn:disabled{opacity:.35;cursor:default}
.dirbtn:disabled:hover{color:var(--soft);border-color:var(--edge2)}
.dirstate{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--mut);text-transform:uppercase}
.dirmoves{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.dirmoves .mvtitle{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin:4px 0 0}
.dirmoves .mvtitle.bad{color:var(--sig)} .dirmoves .mvtitle.good{color:var(--ok)}
.dirmove{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--edge);border-left:3px solid;
  border-radius:9px;padding:11px 14px;opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}
.dirmove.in{opacity:1;transform:none}
.dirmove.bad{border-left-color:var(--sig)} .dirmove.good{border-left-color:var(--ok)}
.dirmove .gx{flex:none;font-family:var(--mono);font-weight:700;font-size:14px;padding-top:1px}
.dirmove.bad .gx{color:var(--sig)} .dirmove.good .gx{color:var(--ok)}
.dirmove .mv{font-weight:600;color:var(--ink);font-size:14px;line-height:1.45}
.dirmove .lb{font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:1px}
.dircaption{font-size:14.5px;color:var(--soft);line-height:1.55;max-width:60ch;margin:8px 0}
.dirdownload{position:absolute;left:12px;bottom:46px;display:flex;gap:9px;align-items:center;background:#fff;border:1px solid #D5DCE3;
  border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;color:#33404D;box-shadow:0 10px 28px rgba(0,0,0,.3);z-index:8;animation:pop .3s ease}
.dirdownload .ext2{font-family:var(--mono);font-size:9px;background:#FDECEA;color:#B0261A;padding:2px 6px;border-radius:4px}
.dirtoast{position:absolute;right:12px;top:44px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--edge2);
  border-radius:8px;padding:8px 13px;font-size:12px;color:var(--soft);z-index:8;box-shadow:0 10px 28px rgba(0,0,0,.4);animation:pop .3s ease}
.dirtoast b{color:var(--ink)}

/* ============ guide (narrator face) ============ */
.guide-face{display:inline-flex;flex:none;vertical-align:middle}
.guide-face svg{display:block}
.guide-face g[class^="m-"]{display:none}
.guide-face[data-mood="neutral"] .m-neutral{display:block}
.guide-face[data-mood="think"] .m-think{display:block}
.guide-face[data-mood="good"] .m-good{display:block}
.guide-face[data-mood="alert"] .m-alert{display:block}
.guide-face[data-mood="party"] .m-party{display:block}
.guiderow{display:flex;gap:11px;align-items:center;margin-bottom:10px}
.guiderow .gsay{font-size:13.5px;color:var(--soft);line-height:1.5}

/* ============ gamification ============ */
.btoast{position:fixed;right:14px;top:76px;z-index:80;display:flex;gap:10px;align-items:center;background:var(--panel);
  border:1px solid var(--edge2);border-left:3px solid var(--mint);border-radius:10px;padding:11px 15px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);animation:pop .3s ease;max-width:290px}
.btoast .bi{font-size:17px;flex:none}
.btoast .bn{font-family:var(--disp);font-weight:800;font-size:12.5px;letter-spacing:.3px}
.btoast .bd3{font-size:11.5px;color:var(--mut);line-height:1.4}
.btoast.out{opacity:0;transition:opacity .5s ease}
.bgrid{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.bchip{display:inline-flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--edge2);border-radius:99px;
  padding:7px 14px 7px 10px;font-size:12px;font-weight:600;color:var(--ink)}
.bchip .bi{font-size:14px}
.bchip.locked{opacity:.38;filter:grayscale(1)}
.report-btn{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--edge2);color:var(--soft);
  border-radius:6px;padding:9px 15px;font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;transition:all .15s ease}
.report-btn:hover{border-color:var(--sig);color:var(--ink)}
.report-btn .flag{color:var(--sig)}
.goodnote{display:flex;gap:10px;align-items:center;border:1px solid #2A7A57;background:var(--okD);border-radius:9px;
  padding:9px 13px;margin:0 0 12px;font-size:12.5px;color:#9FF0CC;line-height:1.5;animation:pop .3s ease}
.goodnote b{color:#E7FFF3}
.goodnote.out{opacity:0;transition:opacity .6s ease}

/* demo layout: everything above the fold, side by side */
.h2.sm{font-size:clamp(19px,3.2vw,24px);margin-bottom:8px}
.demogrid{display:grid;grid-template-columns:minmax(0,53%) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}
@media (max-width:660px){ .demogrid{grid-template-columns:1fr} }
.demomail .mail{margin-bottom:0}
.demomail .mail-head{padding:11px 14px 9px}
.demomail .mail-subj{font-size:13.5px;margin-bottom:7px}
.demomail .mail-body{font-size:12.5px;line-height:1.52;padding:12px 14px 4px}
.demomail .mail-body p{margin-bottom:8px}
.demomail .bigbtn-link{padding:8px 14px;font-size:12px}

/* verdict console */
.console{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:17px 18px;margin-bottom:14px}
.console .q{font-family:var(--disp);font-weight:700;font-size:15.5px;letter-spacing:.2px;margin-bottom:12px}

.vbtn{flex:1;min-width:130px;border-radius:6px;padding:13px 14px;font-family:var(--disp);font-size:12.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  border:1.5px solid var(--edge2);background:var(--panel2);color:var(--ink);transition:all .15s ease}
.vbtn:hover{transform:translateY(-2px);border-color:var(--mut)}

  border:1.5px solid var(--edge2);background:var(--panel2);color:var(--ink);transition:all .15s ease}

  width:min(720px,94vw);max-height:calc(100vh - 110px);overflow:auto;
  border-radius:12px;padding:16px 22px 20px;border:1px solid;animation:fadeUp .4s ease;

.clicknote{border:1px solid #7A3128;background:var(--sigD);border-radius:9px;padding:11px 14px;margin:0 0 12px;

.buildrow.train .end{color:var(--sig)}

.map{display:flex;flex-direction:column;margin:16px 0 6px}

.mnode.hit .pt{border-color:var(--sig);background:var(--sig)}

/* calibration */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}

.statrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}

.tier{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--edge2);border-radius:9px;padding:15px 22px;margin:8px 0 14px;
  background:linear-gradient(135deg,rgba(255,90,69,.1),transparent 60%)}
.tier .tn{font-family:var(--disp);font-weight:900;font-size:19px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink)}

/* engine panel */
.engine{border:1px dashed var(--edge2);border-radius:9px;margin:18px 0;overflow:hidden}
.engine summary{cursor:pointer;padding:13px 17px;font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.4px;color:var(--soft);list-style:none;display:flex;gap:10px;align-items:center;text-transform:uppercase}
.engine summary::before{content:"▸";color:var(--sig);transition:transform .2s ease}
.engine[open] summary::before{transform:rotate(90deg)}

.srlive{position:absolute;left:-9999px}

<script>
(function(){
"use strict";

/* ================= SOUND (Web Audio, synthesized, single-file) ================= */
var SND = (function(){
  var ctx = null, muted = false, MASTER = 0.22;
  try { muted = localStorage.getItem("byc-muted")==="1"; } catch(e){}
  function ac(){
    if (ctx) return ctx;
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ ctx = null; }
    return ctx;
  }
  function env(g, t0, a, d, peak){
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak*MASTER, t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d);
  }
  function tone(freq, type, a, d, peak, when, detune){
    var c = ac(); if (!c || muted) return;
    if (c.state==="suspended") c.resume();
    var t0 = c.currentTime + (when||0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (detune) o.frequency.exponentialRampToValueAtTime(detune, t0+a+d);
    env(g, t0, a, d, peak);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+a+d+.05);
  }
  function noise(dur, cf, peak, when){
    var c = ac(); if (!c || muted) return;
    if (c.state==="suspended") c.resume();
    var t0 = c.currentTime + (when||0);
    var len = Math.max(1, Math.floor(c.sampleRate*dur));
    var buf = c.createBuffer(1, len, c.sampleRate);
    var data = buf.getChannelData(0);
    for (var i=0;i<len;i++) data[i] = (Math.random()*2-1)*(1-i/len);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(cf, t0); f.frequency.exponentialRampToValueAtTime(cf*0.4, t0+dur);
    var g = c.createGain(); env(g, t0, 0.01, dur, peak);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t0);
  }
  return {
    unlock: function(){ var c=ac(); if(c && c.state==="suspended") c.resume(); },
    tick:  function(){ tone(1100,"sine",.004,.05,.16); },
    swish: function(){ noise(.22, 1400, .1); },
    good:  function(){ tone(660,"sine",.008,.12,.2); tone(990,"sine",.008,.16,.16,.09); },

    toggle: function(){ muted = !muted; try{ localStorage.setItem("byc-muted", muted?"1":"0"); }catch(e){} return muted; },
    isMuted: function(){ return muted; }
  };

  s += '<g class="m-party"><path d="M16 25.6 l2.6 -3 l2.6 3" fill="none" stroke="#7DFFC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'

  s += '</svg></span>';
  return s;
}

/* ================= BADGES (client-side, celebrate only) ================= */
var BADGES = [
  { id:"peek",    icon:"👁", n:"First Peek",       d:"Looked before deciding. The habit begins." },

function wireMail(opts){
  // opts: {onPeek(), onClick(), coach:boolean}
  opts = opts || {};
  var peeked = false, clickedOnce = false;
  var addr = $app.querySelector("[data-addr]");
  var insBtn = $app.querySelector("[data-inspect]");
  if (insBtn){
    var pinned = false;
    var idleLbl = insBtn.textContent;
    function reveal(){
      addr.removeAttribute("hidden");
      if(!peeked){ peeked=true; S.peeks++; if (S.peeks===1) award("peek"); }
      if(opts.onPeek) opts.onPeek("sender");
    }
    function conceal(){ if (pinned) return; addr.setAttribute("hidden",""); }
    if (HOVERCAP){
      insBtn.addEventListener("mouseenter", reveal);
      insBtn.addEventListener("mouseleave", conceal);
    }
    insBtn.addEventListener("focus", reveal);
    insBtn.addEventListener("blur", conceal);
    // Clicking the sender chip is mail-client UI (like expanding details in Gmail/Outlook):
    // it pins the reveal open. It is NEVER counted as a dangerous click.
    insBtn.addEventListener("click", function(){
      SND.tick();
      pinned = !pinned;
      if (pinned){ reveal(); insBtn.textContent = "pinned · hide ▴"; }
      else { insBtn.textContent = idleLbl; addr.setAttribute("hidden",""); }
    });
  }
  var bar = $app.querySelector("[data-statusbar]");
  var txt = $app.querySelector("[data-statustext]");
  var idle = txt ? txt.textContent : "";
  $app.querySelectorAll("[data-link]").forEach(function(b){
    var url = b.getAttribute("data-link");
    var holdTimer = null, held = false;
    function peek(){
      txt.textContent = url; bar.classList.remove("alerted");
      if(!peeked){ peeked=true; S.peeks++; if (S.peeks===1) award("peek"); }
      if(opts.onPeek) opts.onPeek("link");
      announce("Link destination: "+url);
    }
    function unpeek(){ txt.textContent = idle; }
    b.addEventListener("mouseenter", peek);
    b.addEventListener("mouseleave", unpeek);
    b.addEventListener("focus", peek);
    b.addEventListener("blur", unpeek);
    // Press-and-hold works with ANY pointer (mouse, touch, pen): hold ≥400ms peeks
    // and the release is swallowed — it can never fall through to a click.
    b.addEventListener("pointerdown", function(){
      held = false; clearTimeout(holdTimer);
      holdTimer = setTimeout(function(){ held = true; peek(); }, 400);
    });
    b.addEventListener("pointerup", function(){ clearTimeout(holdTimer); });
    b.addEventListener("pointerleave", function(){ clearTimeout(holdTimer); });
    b.addEventListener("pointercancel", function(){ clearTimeout(holdTimer); held = false; });
    b.addEventListener("click", function(e){
      e.preventDefault();
      if (held){ held = false; return; }
      // Safety: only genuine user gestures may ever log a consequence.
      if (S.demoing || !e.isTrusted) return;
      // A quick, real click on an email link: the consequence
      S.clicks++; updRecord(); SND.alarm();
      bar.classList.add("alerted");
      txt.textContent = "CLICK LOGGED · "+url+" just opened in the real world";
      announce("You clicked the link. In the real world, that destination just opened.");
      if (!clickedOnce){
        clickedOnce = true;
        if (opts.onClick) opts.onClick(url);
      }
    });
  });
  return { hasPeeked: function(){ return peeked; } };
}

    if (!b.classList.contains("dirbtn")) b.setAttribute("tabindex","-1");
  });

function goodPeekNote(){
  var slot = $app.querySelector("[data-goodnote]");
  if (!slot || slot.getAttribute("data-shown")) return; // once per screen, even after the fade
  slot.setAttribute("data-shown","1");
  slot.innerHTML = '<div class="goodnote">'+guideSVG("good",28)+'<span><b>Peeked before deciding.</b> That is the habit.</span></div>';
  // delayed so it does not clobber the link-destination announcement in the same tick
  setTimeout(function(){ announce("Peeked before deciding. That is the habit."); }, 1600);
  setTimeout(function(){ var n = slot.querySelector(".goodnote"); if (n) n.classList.add("out"); }, 3200);
  setTimeout(function(){ slot.innerHTML = ""; }, 3900);
}

function verdictScreen(it, opts){
  var h = '<p class="case">'+esc(opts.kicker)+'</p>';
  h += mailHTML(it, opts.exhibit);
  h += '<div data-goodnote aria-hidden="true"></div>';
  h += '<div data-clicknote></div>';
  h += '<div class="console"><p class="q">Your call: legit, or phish?</p>';
  h += '<div class="vrow" role="group" aria-label="Verdict">';
  h += '<button class="vbtn safe" type="button" data-v="safe">Legit ✓</button>';
  h += '<button class="vbtn phish" type="button" data-v="phish">Phish ⚠</button></div>';
  h += '<div class="crow" role="group" aria-label="Confidence" data-crow hidden>';
  h += '<button class="cbtn" type="button" data-c="1">I\'m sure</button>';
  h += '<button class="cbtn" type="button" data-c="0">Not sure</button></div>';
  h += '<div style="margin-top:12px"><button class="report-btn" type="button" data-report aria-label="Report phishing to Security"><span class="flag" aria-hidden="true">⚑</span> Report phishing</button></div>';
  h += '</div><div data-fb></div>';
  show(h);
  if (opts.progPhase !== undefined) phaseProg(opts.progPhase, opts.progFrac);
  if (opts.coach) mountCoach();

  S.peekOps++;
  var mw = wireMail({
    onPeek: function(){
      // the coach banner stays (its demo loops); only the attention pulses clear
      $app.querySelectorAll(".pulse").forEach(function(x){ x.classList.remove("pulse"); });
      goodPeekNote();
    },
    onClick: function(){
      var slot = $app.querySelector("[data-clicknote]");
      if (slot && !slot.innerHTML) slot.innerHTML = clickCoachNote();
    }
  });

  var repBtn = $app.querySelector("[data-report]");
  if (repBtn){
    var repCounted = false;
    repBtn.addEventListener("click", function(){
      SND.tick();
      if (!repCounted){ repCounted = true; S.reports++; }
      var bar = $app.querySelector("[data-statusbar]"), txt = $app.querySelector("[data-statustext]");
      if (bar && txt){ bar.classList.remove("alerted"); txt.textContent = "REPORTED · good instinct to build. Here, make the call first: legit or phish."; }
      announce("Reported. Good instinct to build. Here, make the call first: legit or phish.");
    });
  }

  var verdict = null;
  var vb = $app.querySelectorAll(".vbtn");
  vb.forEach(function(b){ b.addEventListener("click", function(){
    SND.tick();
    dismissCoach(); // the learner has committed to a call; coaching steps back
    vb.forEach(function(x){x.classList.remove("sel");});
    b.classList.add("sel");
    verdict = b.getAttribute("data-v");
    $app.querySelector("[data-crow]").removeAttribute("hidden");
  });});
  $app.querySelectorAll(".cbtn").forEach(function(b){ b.addEventListener("click", function(){
    if (!verdict) return;
    $app.querySelectorAll(".cbtn").forEach(function(x){x.classList.remove("sel");});
    b.classList.add("sel");
    var confident = b.getAttribute("data-c")==="1";
    var correct = (verdict === it.verdict);
    if (it.verdict==="phish"){ correct ? S.hits++ : S.miss++; }
    else { correct || S.fa++; }
    if (correct){ S.streak++; if (S.streak > S.bestStreak) S.bestStreak = S.streak; if (S.streak===5) award("streak5"); }
    else { S.streak = 0; }
    updRecord();
    S.log.push({ id:it.id, comp:it.comp, correct:correct, confident:confident, phase:opts.phase, peeked:mw.hasPeeked() });
    $app.querySelectorAll(".vbtn,.cbtn").forEach(function(x){ x.disabled = true; x.style.opacity = x.classList.contains("sel")?"1":".35"; });
    renderFeedback(it, correct, function(){ opts.onDone(correct, confident); }, confident);
  });});
}

function makeDraggable(panel, handle){
  var sx, sy, ox, oy, dragging = false;
  handle.addEventListener("pointerdown", function(e){
    dragging = true;
    try { handle.setPointerCapture(e.pointerId); } catch(err){}
    var r = panel.getBoundingClientRect();
    ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY;
    panel.style.left = ox+"px"; panel.style.top = oy+"px";
    panel.style.transform = "none"; panel.style.bottom = "auto";
    e.preventDefault();
  });
  handle.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var nl = ox + (e.clientX - sx), nt = oy + (e.clientY - sy);
    nl = Math.min(Math.max(nl, 70 - panel.offsetWidth), window.innerWidth - 70);
    nt = Math.min(Math.max(nt, 6), window.innerHeight - 70);
    panel.style.left = nl+"px"; panel.style.top = nt+"px";
  });
  handle.addEventListener("pointerup", function(){ dragging = false; });
  handle.addEventListener("pointercancel", function(){ dragging = false; });
}

function showPanel(cls, innerHTML, onNext){
  var box = $app.querySelector("[data-fb]");
  box.innerHTML = '<div class="feedback '+cls+'" role="dialog" aria-label="Feedback">'
    + '<div class="fbhandle" data-drag>drag to move · the email stays behind</div>'
    + innerHTML + '</div>';
  var panel = box.querySelector(".feedback");
  makeDraggable(panel, box.querySelector("[data-drag]"));
  var nextBtn = box.querySelector("[data-next]");
  nextBtn.addEventListener("click", function(){ panel.remove(); onNext(); });
  nextBtn.focus();
}

function renderFeedback(it, correct, onNext, confident){
  var isPhish = it.verdict==="phish";
  correct ? SND.good() : SND.bad();
  setTimeout(SND.stamp, 120);
  var stampTxt = isPhish ? ("PHISH"+(correct?" · CAUGHT":" · MISSED")) : ("LEGIT"+(correct?" · CLEARED":" · FALSE ALARM"));
  var h = '<div class="guiderow" style="margin-bottom:4px">'+guideSVG(correct?"good":"alert",40)
        + '<span class="stampX" style="margin-bottom:0">'+stampTxt+'</span></div>';
  h += '<h3>'+(correct ? "Correct." : (isPhish ? "This one was a phish." : "This one was legitimate."))+'</h3>';
  h += '<div class="cues">'+it.cues.map(function(c){return '<div class="cue">'+esc(c)+'</div>';}).join("")+'</div>';
  h += '<p>'+esc(it.explain)+'</p>';
  // calibration coaching at the moment it matters, not only in the debrief
  if (confident !== undefined){
    if (!correct && confident){
      h += '<p style="margin-top:10px"><b style="color:#FFA79C">Sure, and wrong.</b> That is the danger-zone square on your calibration report. This exact combination is what the peek is for.</p>';
    } else if (correct && !confident){
      h += '<p style="margin-top:10px"><b style="color:#9FF0CC">Right call, but a guess.</b> Reread the cues above and find the one that would have settled it.</p>';
    }
  }
  h += '<div class="btnrow"><button class="btn" type="button" data-next>Continue</button></div>';
  announce(correct ? "Correct. " + it.explain : "Not quite. " + it.explain);
  showPanel(correct?"good":"bad", h, onNext);
}

/* Personalized retraining plan: reads the run's behavior (clicks, danger-zone calls,
   unpeeked misses, false alarms, module results, boss responses) and returns the
   top three priorities. This is the Level 2 to Level 3 bridge in a deployment. */
function buildRetrainPlan(q){
  var recs = [];
  if (S.clicks > 0){
    recs.push({ p:0, t:"Break the click reflex", d:"You clicked "+S.clicks+" live link"+(S.clicks>1?"s":"")+". Drill the peek before anything else: hover or hold, read the destination right to left, then decide. Nothing opens until the domain earns it." });
  }
  var blindMisses = S.log.filter(function(l){ return !l.correct && !l.peeked; }).length;
  if (blindMisses > 0){
    recs.push({ p:1.5, t:"Your misses were blind calls", d:blindMisses+" of your wrong answers came on emails you never peeked. The pattern is the lesson: the peek is not optional, it is the method." });
  }
  Object.keys(COMPS).forEach(function(k){
    var items = S.log.filter(function(l){ return l.comp===k; });
    if (!items.length) return;
    var dz = items.filter(function(l){ return !l.correct && l.confident; }).length;
    var wrong = items.filter(function(l){ return !l.correct; }).length;
    var r = S.moduleResults[k];
    if (dz > 0){
      recs.push({ p:1, t:COMPS[k].name+" is your danger zone", d:"Sure and wrong "+dz+" time"+(dz>1?"s":"")+" on this skill. That is the square where real clicks happen. On the retake, slow these calls down and peek before you feel certain." });
    } else if (r && r.right < 2){
      recs.push({ p:2, t:"One more pass at "+COMPS[k].name.toLowerCase(), d:"The module reps did not lock in this run. Watch the demo again on the retake, then take the checks with the cue list in mind." });
    } else if (wrong > 0 && !S.mastered[k]){
      recs.push({ p:3, t:"Sharpen "+COMPS[k].name.toLowerCase(), d:wrong+" miss"+(wrong>1?"es":"")+" here, but honestly flagged. The instinct is close: name the specific cue that settles each call and it becomes a skill." });
    }
  });
  if (S.fa >= 2){
    recs.push({ p:2.5, t:"Learn what legitimate looks like", d:S.fa+" false alarms. Suspicion is a skill, not a lifestyle: revisit the legit emails and notice their pattern (real domain, matching link, no ask)." });
  }
  var b1 = null, b2 = null;
  S.log.forEach(function(l){ if (l.id==="B1") b1 = l; if (l.id==="B2") b2 = l; });
  if (b1 && !b1.correct){
    recs.push({ p:2.1, t:"Rehearse the report", d:"The spear phish beat you at the response step. Detection is half the skill: when the peek fails an email, the next move is the report button, not a reply, and not a forward." });
  }
  if (b2 && !b2.correct){
    recs.push({ p:2.2, t:"Drill the verification protocol", d:"The manager scenario got you. Unexpected asks for sensitive data get an out-of-band check every time, even from real accounts. Thirty seconds, known channel, then act." });
  }
  recs.sort(function(a,b){ return a.p - b.p; });
  if (!recs.length){
    return { urgent:false, headline:"Nothing urgent. Maintain the reflex.",
      recs:[{ t:"Spaced retrieval", d:"Accurate, calibrated, and zero clicks. The enemy now is decay: retake this in a week with fresh eyes and see if the reflex held without warming up." }] };
  }
  var urgent = recs[0].p < 2;
  return { urgent:urgent, headline: urgent ? "Start here before anything else." : "Close these gaps, then retake.", recs: recs.slice(0,3) };
}

function scrCalibration(){
  setPhase(4); phaseProg(4,1);
  var verdicts = S.log.filter(function(l){ return l.phase!=="boss"; });
  var q = { cal:0, danger:0, lucky:0, shy:0 };
  verdicts.forEach(function(l){
    if (l.correct && l.confident) q.cal++;
    else if (!l.correct && l.confident) q.danger++;
    else if (l.correct && !l.confident) q.lucky++;
    else q.shy++;
  });
  var all = S.log.length;
  var right = S.log.filter(function(l){return l.correct;}).length;
  var acc = all ? right/all : 0;
  var calibrated = q.danger===0 && S.clicks===0;
  var tier = TIERS.find(function(t){ return acc >= t.min && (t.min<.9 || calibrated); }) || TIERS[TIERS.length-1];
  var peekRate = S.peekOps ? Math.round(100*S.peeks/S.peekOps) : 0;
  if (S.clicks===0) award("zero");
  if (q.danger===0) award("cal");

  var h = '<p class="case">Debrief · 2 of 2</p>';
  h += '<div class="guiderow" style="margin-bottom:12px">'+guideSVG("party",48)+'<div class="h2" style="margin-bottom:0">Your calibration report.</div></div>';
  h += '<p class="body">Security research keeps finding the same thing: the riskiest clicks come from people who were <b style="color:var(--ink)">sure and wrong</b>. Accuracy matters; knowing what you know is the real armor.</p>';
  h += '<div class="quad">';
  h += '<div class="qcell cal"><div class="qn">'+q.cal+'</div><div class="qt">Calibrated ✓</div><div class="qd">Correct and confident. Judgment you can act on at speed.</div></div>';
  h += '<div class="qcell danger"><div class="qn">'+q.danger+'</div><div class="qt">Danger zone</div><div class="qd">Confident and wrong. This is where real clicks happen. '+(q.danger?'Study these misses first.':'Empty. Exactly right.')+'</div></div>';
  h += '<div class="qcell lucky"><div class="qn">'+q.lucky+'</div><div class="qt">Lucky guesses</div><div class="qd">Correct but unsure. The instinct is forming; the reps make it explicit.</div></div>';
  h += '<div class="qcell shy"><div class="qn">'+q.shy+'</div><div class="qt">Honest gaps</div><div class="qd">Wrong and knew it might be. Healthy self-awareness, now trained.</div></div>';
  h += '</div>';
  h += '<div class="statrow">';
  h += '<div class="stat"><div class="sn" style="color:var(--ok)">'+S.hits+'</div><div class="sl">Phish caught</div></div>';
  h += '<div class="stat"><div class="sn" style="color:var(--sig)">'+S.miss+'</div><div class="sl">Missed</div></div>';
  h += '<div class="stat"><div class="sn">'+S.fa+'</div><div class="sl">False alarms</div></div>';
  h += '<div class="stat"><div class="sn" style="color:'+(S.clicks?"var(--sig)":"var(--ok)")+'">'+S.clicks+'</div><div class="sl">Links clicked</div></div>';
  h += '<div class="stat"><div class="sn">'+peekRate+'%</div><div class="sl">Emails peeked</div></div>';
  h += '<div class="stat"><div class="sn" style="color:var(--mint)">'+S.reports+'</div><div class="sl">Reported</div></div>';
  h += '</div>';
  if (S.bossReport!==null) h += '<p class="body">Time to report the spear phish: <b style="color:var(--ink)">'+S.bossReport+'s</b>. Speed there is a virtue.</p>';
  h += '<div class="tier"><div><div class="tn">'+esc(tier.name)+'</div><div class="td">'+esc(tier.d)+'</div></div></div>';

  // ---- personalized retraining plan, derived from this run's behavior ----
  var plan = buildRetrainPlan(q);
  h += '<p class="case" style="margin-top:18px">Your retraining plan · built from this run</p>';
  h += '<div class="teach" style="border-left-color:'+(plan.urgent?"var(--sig)":"var(--ok)")+'">';
  h += '<h3>'+esc(plan.headline)+'</h3>';
  plan.recs.forEach(function(r, ri){
    h += '<p style="margin-bottom:8px"><b style="color:var(--ink)">'+(ri+1)+'. '+esc(r.t)+'.</b> '+esc(r.d)+'</p>';
  });
  h += '<p class="mut" style="font-size:12.5px;margin-bottom:0">In a deployed program these would become targeted assignments and a spaced booster in about 30 days. Here, the retake rebuilds the course around them.</p>';
  h += '</div>';

  h += '<p class="case" style="margin-top:18px">Field record · '+S.badges.length+' of '+BADGES.length+' badges</p>';
  h += '<div class="bgrid">'+BADGES.map(function(b){
    var got = S.badges.indexOf(b.id)!==-1;
    return '<span class="bchip'+(got?'':' locked')+'"'+(got?'':' title="Locked"')+'><span class="bi" aria-hidden="true">'+b.icon+'</span>'+esc(b.n)+(got?'':' 🔒')+'</span>';
  }).join("")+'</div>';
  h += '<p class="body">Carry two habits out of here: <b style="color:var(--ink)">peek before you click, and verify unexpected asks out of band.</b> Thirty seconds of friction, every time, is the whole game.</p>';

  h += '<details class="engine"><summary>How this course adapted to you</summary><div class="einner">';
  h += '<p>The routing engine is deliberately simple, and fully inspectable:</p>';
  h += '<div class="erule"><b>mastery(skill)</b> = both diagnostic items correct <b>AND</b> both answered "I\'m sure"<br><b>if</b> mastered → skip module · <b>else</b> → module + 2-item mastery check<br><b>if</b> a check is missed → one extra rep on the same skill<br><b>boss level</b> → everyone, response actions instead of verdicts<br><b>calibration</b> = confidence × correctness on every verdict · <b>clicks</b> are logged as real-world outcomes</div>';
  h += '<p>Your run: '+Object.keys(COMPS).map(function(k){return COMPS[k].name+" → "+(S.mastered[k]?"skipped":"trained");}).join(" · ")+' · links clicked: '+S.clicks+'. In a deployment, each event maps to an xAPI statement: how a real program measures Level 2 learning and targets Level 3 follow-up.</p>';
  h += '</div></details>';

  h += '<div class="btnrow"><button class="btn" type="button" data-retake>Retake with fresh eyes ↻</button>';
  h += '<button class="btn ghost" type="button" data-card>Download result card ↓</button></div>';
  h += '<p class="foot-note">Answer differently and the course rebuilds itself: different modules, different length, same boss level. That is the point.<br><br>A self-directed portfolio build by Christopher Kokoski. Meridian Health and all senders are fictional. This is an educational awareness demonstration, not professional cybersecurity training, and not a substitute for your organization\'s security policies or formal training. The author accepts no liability for real-world security decisions. Always follow your employer\'s reporting process for suspicious messages.</p>';
  show(h);
  SND.tada();
  announce("Course complete. Tier: "+tier.name);
  $app.querySelector("[data-retake]").addEventListener("click", function(){
    // in-place restart: no page reload, so it works from file:// and any server hiccup
    SND.tick();
    S.log=[]; S.hits=0; S.miss=0; S.fa=0; S.clicks=0;
    S.mastered={}; S.assigned=[]; S.moduleResults={};
    S.coldPath=null; S.peeks=0; S.peekOps=0; S.coached=false;
    S.streak=0; S.bestStreak=0; S.badges=[]; S.reports=0; S.bossReport=null; S.demoing=false;
    updRecord();
    buildQueue();
    S.qi++; S.queue[S.qi]();
  });
  $app.querySelector("[data-card]").addEventListener("click", function(){
    SND.tick();
    var blob = new Blob([resultCardSVG(tier, q, peekRate)], {type:"image/svg+xml"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "before-you-click-result.svg";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    announce("Result card downloaded.");
  });
}

function resultCardSVG(tier, q, peekRate){
  var F = "Arial, Helvetica, sans-serif";
  var earned = BADGES.filter(function(b){ return S.badges.indexOf(b.id)!==-1; });
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Before You Click result card">';
  s += '<rect width="640" height="400" fill="#07090C"/>';
  s += '<rect x="1.5" y="1.5" width="637" height="397" fill="none" stroke="#28313D" stroke-width="2"/>';
  s += '<rect width="640" height="6" fill="#FF5A45"/>';
  s += '<text x="42" y="56" font-family="'+F+'" font-size="12" letter-spacing="5" fill="#8A94A0">BEFORE YOU CLICK · FIELD RECORD</text>';
  s += '<text x="42" y="104" font-family="'+F+'" font-size="34" font-weight="900" fill="#EDF1F4">'+esc(tier.name.toUpperCase())+'</text>';
  s += '<text x="42" y="130" font-family="'+F+'" font-size="13" fill="#B4BDC6">'+esc(tier.d)+'</text>';
  var stats = [
    ["CAUGHT", S.hits, "#3ECF8E"], ["MISSED", S.miss, "#FF5A45"], ["CLICKED", S.clicks, S.clicks?"#FF5A45":"#3ECF8E"],
    ["PEEKED", peekRate+"%", "#EDF1F4"], ["REPORTED", S.reports, "#7DFFC4"], ["DANGER ZONE", q.danger, q.danger?"#FF5A45":"#3ECF8E"]
  ];
  for (var i=0;i<stats.length;i++){
    var x = 42 + i*94;
    s += '<rect x="'+(x-10)+'" y="156" width="86" height="74" rx="8" fill="#10141B" stroke="#1B222B"/>';
    s += '<text x="'+(x+33)+'" y="196" text-anchor="middle" font-family="'+F+'" font-size="24" font-weight="900" fill="'+stats[i][2]+'">'+stats[i][1]+'</text>';
    s += '<text x="'+(x+33)+'" y="216" text-anchor="middle" font-family="'+F+'" font-size="8" letter-spacing="1.5" fill="#8A94A0">'+stats[i][0]+'</text>';
  }
  s += '<text x="42" y="272" font-family="'+F+'" font-size="11" letter-spacing="3" fill="#8A94A0">BADGES · '+earned.length+' OF '+BADGES.length+'</text>';
  var bx = 42, by = 282;
  for (var j=0;j<earned.length;j++){
    var wch = earned[j].n.length*7.2 + 40;
    if (bx + wch > 630){ bx = 42; by += 34; } // wrap so a full badge run never clips
    s += '<rect x="'+bx+'" y="'+by+'" width="'+wch+'" height="28" rx="14" fill="#10141B" stroke="#28313D"/>';
    s += '<text x="'+(bx+14)+'" y="'+(by+19)+'" font-family="'+F+'" font-size="13" fill="#EDF1F4">'+earned[j].icon+' '+esc(earned[j].n)+'</text>';
    bx += wch + 10;
  }
  if (!earned.length) s += '<text x="42" y="306" font-family="'+F+'" font-size="12" fill="#626C77">Retake the course to start collecting.</text>';
  s += '<text x="42" y="366" font-family="'+F+'" font-size="10.5" fill="#626C77">An adaptive phishing-judgment simulation · a self-directed build by Christopher Kokoski · Meridian Health is fictional</text>';
  s += '</svg>';
  return s;
}

/* ================= FLOW ================= */

function buildQueue(){
  S.queue = [scrCover, scrColdEmail, scrBreach];
  for (var i=0;i<DIAG.length;i++) S.queue.push(scrDiag(i));
  S.queue.push(function(){
    scrPathBuild();
    var insertAt = S.qi+1;
    var seq = [scrPlaybook];
    S.assigned.forEach(function(k){
      seq.push(scrTeach(k), scrCheck(k,0), scrCheck(k,1), scrModuleDone(k));
    });
    seq.push(function(){ scrBossIntro(); });
    for (var b=0;b<BOSS.length;b++) seq.push(scrBoss(b));
    seq.push(function(){ scrPathMap(); }, function(){ scrCalibration(); });
    Array.prototype.splice.apply(S.queue,[insertAt,0].concat(seq));
  });
  S.qi = -1;
}

buildQueue();
S.qi++; S.queue[S.qi]();
})();
</script>
